<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260">
  <rect width="100%" height="100%" fill="#0b1120" rx="10"/>
  <!-- Triangle ABC -->
  <polygon points="260,35 60,185 460,185" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Internal Bisector AD -->
  <line x1="260" y1="35" x2="210" y2="185" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Angle arcs at A -->
  <path d="M 248,58 A 25,25 0 0,0 258,62" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
  <path d="M 258,62 A 25,25 0 0,0 270,57" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
  <!-- Points -->
  <circle cx="260" cy="35" r="4.5" fill="#f8fafc"/>
  <circle cx="60" cy="185" r="4.5" fill="#f8fafc"/>
  <circle cx="460" cy="185" r="4.5" fill="#f8fafc"/>
  <circle cx="210" cy="185" r="4.5" fill="#38bdf8"/>
  <!-- Labels -->
  <text x="255" y="24" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="16">A</text>
  <text x="38" y="192" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="16">B</text>
  <text x="472" y="192" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="16">C</text>
  <text x="202" y="210" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16">D</text>
  <!-- Sides -->
  <text x="135" y="105" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="14">边 c (AB)</text>
  <text x="365" y="105" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="14">边 b (AC)</text>
  <text x="120" y="178" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="14">BD (段 m)</text>
  <text x="320" y="178" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="14">DC (段 n)</text>
  <text x="220" y="115" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14">d (AD)</text>
  <!-- Formula Banner at bottom -->
  <rect x="30" y="222" width="500" height="30" fill="#1e293b" rx="6"/>
  <text x="280" y="242" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">
    内角平分线比例: BD / DC = AB / AC  |  线段长公式: AD² = AB·AC - BD·DC
  </text>
</svg>