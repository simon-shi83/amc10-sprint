<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260">
  <rect width="100%" height="100%" fill="#0b1120" rx="10"/>
  <!-- Triangle ABC -->
  <polygon points="260,35 60,185 460,185" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Cevians AD, BE, CF concurrent at P(260, 125) -->
  <line x1="260" y1="35" x2="260" y2="185" stroke="#38bdf8" stroke-width="2"/>
  <line x1="60" y1="185" x2="340" y2="95" stroke="#34d399" stroke-width="2"/>
  <line x1="460" y1="185" x2="180" y2="95" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="260" cy="125" r="5" fill="#f43f5e"/>
  <text x="270" y="128" fill="#f43f5e" font-family="sans-serif" font-weight="bold" font-size="14">P (共点)</text>
  <!-- Points -->
  <text x="255" y="24" fill="#f8fafc" font-weight="bold">A</text>
  <text x="40" y="192" fill="#f8fafc" font-weight="bold">B</text>
  <text x="472" y="192" fill="#f8fafc" font-weight="bold">C</text>
  <text x="255" y="205" fill="#38bdf8" font-weight="bold">D</text>
  <text x="350" y="95" fill="#34d399" font-weight="bold">E</text>
  <text x="160" y="95" fill="#fbbf24" font-weight="bold">F</text>
  <!-- Banner -->
  <rect x="25" y="218" width="510" height="34" fill="#1e293b" rx="6"/>
  <text x="280" y="240" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">
    塞瓦定理(三线共点): (AF/FB) · (BD/DC) · (CE/EA) = 1
  </text>
</svg>