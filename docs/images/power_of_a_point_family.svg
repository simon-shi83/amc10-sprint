<svg xmlns="http://www.w3.org/2000/svg" width="660" height="260" viewBox="0 0 660 260">
  <rect width="100%" height="100%" fill="#0b1120" rx="10"/>
  <!-- Sub-panel 1: Intersecting Chords (Inside) -->
  <circle cx="110" cy="115" r="60" fill="none" stroke="#64748b" stroke-width="1.8"/>
  <line x1="60" y1="90" x2="165" y2="140" stroke="#38bdf8" stroke-width="2"/>
  <line x1="85" y1="165" x2="140" y2="65" stroke="#34d399" stroke-width="2"/>
  <circle cx="116" cy="116" r="4" fill="#f43f5e"/>
  <text x="122" y="115" fill="#f43f5e" font-family="sans-serif" font-weight="bold" font-size="13">P</text>
  <text x="45" y="90" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12">A</text>
  <text x="170" y="145" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12">B</text>
  <text x="145" y="65" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12">C</text>
  <text x="75" y="180" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12">D</text>
  <text x="110" y="200" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">① 圆内相交弦</text>
  <text x="110" y="218" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">PA·PB = PC·PD</text>

  <!-- Divider 1 -->
  <line x1="220" y1="20" x2="220" y2="240" stroke="#1e293b" stroke-width="2"/>

  <!-- Sub-panel 2: Secant-Secant (Outside) -->
  <circle cx="370" cy="115" r="55" fill="none" stroke="#64748b" stroke-width="1.8"/>
  <circle cx="250" cy="115" r="4" fill="#f43f5e"/>
  <text x="238" y="118" fill="#f43f5e" font-family="sans-serif" font-weight="bold" font-size="13">P</text>
  <line x1="250" y1="115" x2="420" y2="80" stroke="#38bdf8" stroke-width="2"/>
  <line x1="250" y1="115" x2="420" y2="150" stroke="#34d399" stroke-width="2"/>
  <circle cx="320" cy="100" r="3.5" fill="#38bdf8"/><text x="315" y="92" fill="#38bdf8" font-size="11">A</text>
  <circle cx="417" cy="80" r="3.5" fill="#38bdf8"/><text x="424" y="80" fill="#38bdf8" font-size="11">B</text>
  <circle cx="320" cy="130" r="3.5" fill="#34d399"/><text x="315" y="145" fill="#34d399" font-size="11">C</text>
  <circle cx="417" cy="150" r="3.5" fill="#34d399"/><text x="424" y="155" fill="#34d399" font-size="11">D</text>
  <text x="350" y="200" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">② 圆外两条割线</text>
  <text x="350" y="218" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">PA·PB = PC·PD</text>

  <!-- Divider 2 -->
  <line x1="470" y1="20" x2="470" y2="240" stroke="#1e293b" stroke-width="2"/>

  <!-- Sub-panel 3: Tangent-Secant (Outside) -->
  <circle cx="575" cy="115" r="55" fill="none" stroke="#64748b" stroke-width="1.8"/>
  <circle cx="490" cy="145" r="4" fill="#f43f5e"/>
  <text x="480" y="150" fill="#f43f5e" font-family="sans-serif" font-weight="bold" font-size="13">P</text>
  <!-- Secant -->
  <line x1="490" y1="145" x2="628" y2="135" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="522" cy="143" r="3.5" fill="#38bdf8"/><text x="522" y="160" fill="#38bdf8" font-size="11">A</text>
  <circle cx="625" cy="135" r="3.5" fill="#38bdf8"/><text x="633" y="140" fill="#38bdf8" font-size="11">B</text>
  <!-- Tangent PT to top of circle at (560, 62) -->
  <line x1="490" y1="145" x2="560" y2="62" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="560" cy="62" r="4" fill="#fbbf24"/><text x="560" y="52" fill="#fbbf24" font-size="11" font-weight="bold">T (切点)</text>
  <text x="570" y="200" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">③ 切割线定理</text>
  <text x="570" y="218" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">PT² = PA·PB</text>
</svg>