<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260">
  <rect width="100%" height="100%" fill="#0b1120" rx="10"/>
  <!-- Circle -->
  <circle cx="280" cy="115" r="85" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="5,4"/>
  <!-- Inscribed quadrilateral ABCD -->
  <!-- A(240, 35), B(345, 60), C(335, 185), D(205, 160) -->
  <polygon points="240,35 345,60 335,185 205,160" fill="rgba(56,189,248,0.05)" stroke="#94a3b8" stroke-width="2"/>
  <!-- Diagonals AC and BD -->
  <line x1="240" y1="35" x2="335" y2="185" stroke="#f43f5e" stroke-width="2.5"/>
  <line x1="345" y1="60" x2="205" y2="160" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Points -->
  <circle cx="240" cy="35" r="4.5" fill="#f8fafc"/><text x="235" y="25" fill="#f8fafc" font-weight="bold">A</text>
  <circle cx="345" cy="60" r="4.5" fill="#f8fafc"/><text x="355" y="60" fill="#f8fafc" font-weight="bold">B</text>
  <circle cx="335" cy="185" r="4.5" fill="#f8fafc"/><text x="345" y="195" fill="#f8fafc" font-weight="bold">C</text>
  <circle cx="205" cy="160" r="4.5" fill="#f8fafc"/><text x="185" y="165" fill="#f8fafc" font-weight="bold">D</text>
  <!-- Diagonals text -->
  <text x="300" y="115" fill="#f43f5e" font-weight="bold" font-size="13">AC</text>
  <text x="250" y="125" fill="#38bdf8" font-weight="bold" font-size="13">BD</text>
  <!-- Banner -->
  <rect x="25" y="218" width="510" height="34" fill="#1e293b" rx="6"/>
  <text x="280" y="240" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">
    托勒密定理: AC·BD = AB·CD + BC·AD (对角线乘积 = 对边乘积和)
  </text>
</svg>